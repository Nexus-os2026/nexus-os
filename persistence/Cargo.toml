[package]
name = "nexus-persistence"
description = "Retained storage and coding-run evidence primitives for the Mother Nexus foundation"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
testing = []

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
