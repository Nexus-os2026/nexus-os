stages:
  - security
  - test
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "1"

# ---------------------------------------------------------------------------
# Security stage — gating on main and MRs
# ---------------------------------------------------------------------------

security-audit:
  stage: security
  timeout: 30 minutes
  allow_failure: false
  script:
    # Installs the pinned cargo-audit 0.22.1 and cargo-deny 0.19.6 with
    # --locked, then scans this pipeline's Cargo.lock with deny.toml's one
    # exception set. Any install or scanner failure fails the job.
    - scripts/security-audit.sh --install
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# Test stage — runs on every pipeline
# ---------------------------------------------------------------------------

.rust-base:
  stage: test
  variables:
    CARGO_INCREMENTAL: "1"
    RUSTC_WRAPPER: ""
    RUSTFLAGS: "-C debuginfo=1"
  before_script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup component add rustfmt clippy
    - rustup target add wasm32-wasip1

rust-lint:
  extends: .rust-base
  timeout: 15 minutes
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings -A unexpected_cfgs

rust-tests-core:
  extends: .rust-base
  timeout: 30 minutes
  script:
    - cargo test -p nexus-kernel -p nexus-sdk -p nexus-cli

rust-tests-full:
  extends: .rust-base
  timeout: 30 minutes
  script:
    - cargo test --workspace --exclude nexus-kernel --exclude nexus-sdk --exclude nexus-cli --exclude nexus-integration

frontend-tests:
  stage: test
  timeout: 15 minutes
  script:
    - cd app
    - npm ci
    - npm test
    - npm run build
  artifacts:
    paths:
      - app/dist/
    expire_in: 7 days

# ---------------------------------------------------------------------------
# Deploy stage — automated release on tags, manual build
# ---------------------------------------------------------------------------

release:
  stage: deploy
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG"

# WITHDRAWN during Phase Zero (P0-FINAL-GATE-CLOSURE, dossier item J4): this
# job built nexus-cli and published it as a job artifact on version tags.
# nexus-cli is withdrawn, so the job builds and publishes nothing; it fails.
release-build:
  stage: deploy
  allow_failure: true
  script:
    - echo "release-build is withdrawn during Phase Zero; nexus-cli is not built or published" >&2
    - exit 1
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual

# ---------------------------------------------------------------------------
# Nightly stage — runs #[ignore]d tests that need API keys or are long-running.
# Trigger: GitLab scheduled pipeline (set schedule in CI/CD > Schedules).
# Required CI/CD variables: GROQ_API_KEY, OPENROUTER_API_KEY
# ---------------------------------------------------------------------------

nightly-api-key-tests:
  extends: .rust-base
  stage: test
  timeout: 30 minutes
  script:
    - cargo test -p nexus-capability-measurement -- --ignored --nocapture
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

nightly-long-running-tests:
  extends: .rust-base
  stage: test
  timeout: 45 minutes
  script:
    - cargo test -p nexus-capability-measurement -- execute_run1 execute_run2 --ignored --nocapture
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
