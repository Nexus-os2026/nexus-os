[package]
name = "nexus-connectors-llm"
description = "LLM provider connectors (OpenAI, Anthropic, local models) for Nexus OS"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
real-claude = []
real-api-tests = []
# PROVISIONAL (P3-C11-48H-ZIP-Z1-PROVISIONAL-01, Owner adoption required):
# the `local-slm` feature and its Candle dependencies are withdrawn. Every
# candle-core release requires a zip below 9.0.0 (RUSTSEC-2026-0367, -0368,
# -0369), and Cargo.lock records optional dependencies whether or not a
# feature enables them. No workspace crate enabled `local-slm`. Its source
# stays behind `cfg(feature = "local-slm")`, declared below as an expected
# cfg so it is never compiled; the `not(feature = "local-slm")` paths
# (ModelRegistry::load, WhisperTranscriber) return their explicit errors.
# Reintroduce the feature and these dependencies only with a candle-core
# that accepts zip >= 9.0.0.

[dependencies]
nexus-kernel = { path = "../../kernel" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
aes-gcm = "0.10"
hmac = "0.12"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
nexus-sdk = { path = "../../sdk" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }

[lints.rust]
# The withdrawn `local-slm` feature (see [features]) and the `flash-infer`
# feature (withdrawn by the Mother Nexus cleanup with its nexus-flash-infer
# and llama-bridge crates; Ollama is the local runtime): their gated source
# is kept, must stay uncompiled, and is not reported as an unknown cfg.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("local-slm", "flash-infer"))'] }
