<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosie&#39;s Bakery</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:system-ui,sans-serif;font-size:1rem;line-height:1.5;color:#1d1b18;background:#fdfaf5}
header,main,footer{max-width:60rem;margin:0 auto;padding:1rem}
header{border-bottom:1px solid #e4ddd2}
footer{border-top:1px solid #e4ddd2;color:#5b554d}
section{margin:0 0 1.5rem}
h1,h2,h3{line-height:1.2;margin:0 0 .5rem}
h1{font-size:2rem}
h2{font-size:1.5rem}
h3{font-size:1.25rem}
p,ul,ol,address{margin:0 0 1rem}
ul,ol{padding-left:1.25rem}
address{font-style:normal}
h1,h2,h3,p,li,address{overflow-wrap:anywhere}
.lead{font-size:1.125rem}
.muted{color:#5b554d}
.center{text-align:center}
.note{padding:.75rem;border:1px solid #e4ddd2;border-radius:.25rem}
.plain{list-style:none;padding-left:0}
</style>
</head>
<body>
<header>
<h1>Rosie&#39;s Bakery</h1>
<p class="lead">Fresh bread and cakes, baked every morning.</p>
</header>
<main>
<section id="hours">
<h2>Opening hours</h2>
<ul class="plain">
<li>Monday to Friday: 07:00 – 17:00</li>
<li>Saturday: 08:00 – 14:00</li>
<li>Sunday: closed</li>
</ul>
</section>
<section id="contact">
<h2>Contact</h2>
<p>Phone: <strong>01632 960123</strong></p>
<address>12 Mill Lane<br>Exampleton</address>
</section>
</main>
<footer>
<p class="muted"><small>Hours may change on public holidays.</small></p>
</footer>
</body>
</html>
