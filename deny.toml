[graph]
all-features = true

[advisories]
# The Linux security gate's one exception set (P0-LINUX-FINAL-R1, repair B).
#
# scripts/security-audit.sh runs cargo-deny with this file and passes the same
# IDs (read from the `id = "RUSTSEC-..."` entries below) to cargo-audit, which
# does not read this file. Keep one entry per line in this form.
#
# Policy, the same for both scanners when run through the script:
# - a vulnerability fails the gate unless its ID is listed here;
# - unmaintained, unsound and yanked findings are reported for every crate in
#   the graph (the scopes below) as warnings, which is cargo-audit's default;
#   the script passes `-W unmaintained -W unsound` to cargo-deny for the same
#   levels. Each is recorded with its dependency path in the Final Gate
#   dossier;
# - a listed ID that no longer matches anything fails the gate (the script
#   passes `-D advisory-not-detected`), so the list cannot go stale.
#
# Each entry: package, what it is, how it reaches the workspace, and why it is
# accepted for Phase Zero (Architect decision; dossier, "Dependencies").
unmaintained = "all"
unsound = "all"
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2026-0193", reason = "ammonia 4.1.2 sanitizer bypass; web-builder-agent -> desktop; only design_import::import_design uses it, no production code calls it, and builder_import_design is closed in Phase Zero" },
    { id = "RUSTSEC-2026-0213", reason = "ammonia 4.1.2 sanitizer bypass; same path and reachability as RUSTSEC-2026-0193" },
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3.27 unbounded empty DATA frames; readability 0.3 -> reqwest 0.11 -> hyper 0.14 -> nexus-kernel; the kernel calls only readability::extractor::extract on text it holds and builds no reqwest 0.11 client; no fix on the 0.3 line" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.30.0; zbus_xml -> atspi 0.24 -> nexus-ui-repair, a developer tool that is not shipped (D3)" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.30.0; same path and reachability as RUSTSEC-2026-0194" },
    { id = "RUSTSEC-2026-0269", reason = "wasmtime 43.0.2; nexus-sdk, nexus-protocols, nexus-benchmarks; wasmtime-wasi is not in the lockfile and the SDK's WASM sandbox is latent (C5A); fix needs a major upgrade (46.0.3+ or 47.0.4+)" },
    { id = "RUSTSEC-2026-0222", reason = "wasmtime 43.0.2; same path and reachability as RUSTSEC-2026-0269" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps 2.1.0 unmaintained; wasm-compose -> wasmtime 43.0.2; accepted with wasmtime" },
    { id = "RUSTSEC-2026-0250", reason = "im-rc 15.1.0 unmaintained; wasm-compose -> wasmtime 43.0.2; accepted with wasmtime" },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks 0.6.5 unmaintained; wasm-compose -> wasmtime 43.0.2; accepted with wasmtime" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BlueOak-1.0.0",
    "Artistic-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
