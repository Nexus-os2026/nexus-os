name: NEXUS OS Security Audit

# Scans main on every push and weekly (new advisories appear without code
# changes), and any ref on request. Closure candidates are scanned by the
# Linux security-audit job in ci.yml, which runs the same gate.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rustup (rust-toolchain.toml selects the toolchain)
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch fresh advisory databases
        run: rm -rf ~/.cargo/advisory-db ~/.cargo/advisory-dbs

      # scripts/security-audit.sh installs the pinned cargo-audit 0.22.1 and
      # cargo-deny 0.19.6 with --locked and scans Cargo.lock with deny.toml's
      # one exception set. A vulnerability outside the set, a stale
      # exception or any scanner failure fails the job.
      - name: Security gate (cargo-audit and cargo-deny)
        run: scripts/security-audit.sh --install
