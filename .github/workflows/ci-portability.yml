name: NEXUS OS Deferred Windows/macOS Portability

# DEFERRED WINDOWS/MACOS PORTABILITY. The active Phase Zero target is Linux
# only; ci.yml is the final gate. This workflow preserves, unchanged, the
# Windows and macOS validation (workspace tests, the live webview boundary
# harness in the dev and release profiles, the packaged Builder toolchain and
# governed launch) for a future dedicated portability stage. It runs only when
# dispatched manually; it is not part of the Phase Zero gate, and its known
# Windows/macOS failures are not repaired in Phase Zero.
#
# When a portability stage is authorised, run it explicitly on the approved
# candidate, from a branch whose head is that candidate:
#   gh workflow run ci-portability.yml --ref <branch> -f candidate_sha=<full 40-char SHA>
# Every job first checks, before checkout, that the candidate is a full
# lowercase SHA and equals both the commit the run was dispatched for
# (GITHUB_SHA) and the workflow revision executing the gate
# (GITHUB_WORKFLOW_SHA).
# Every job then checks out exactly that commit and fails if it tested
# anything else. These checks establish revision identity only; they do not
# approve or integrate anything.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full 40-character SHA of the Architect-approved candidate commit"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      # Selects the one candidate this run may test, before checkout. The raw
      # dispatch input only reaches the shell as data, through the
      # environment; it is never interpolated or evaluated.
      - name: Select and validate the candidate commit
        id: candidate
        shell: bash
        env:
          RAW_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          reject() {
            echo "::error::$1"
            exit 1
          }
          case "${GITHUB_EVENT_NAME:-}" in
            workflow_dispatch)
              candidate="${RAW_CANDIDATE_SHA-}"
              ;;
            push)
              if [[ "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
                reject "push validation runs only for refs/heads/main"
              fi
              candidate="${GITHUB_SHA:-}"
              ;;
            *)
              reject "unsupported event for the final validation gate"
              ;;
          esac
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            reject "the candidate must be a full 40-character lowercase commit SHA"
          fi
          if [[ "$candidate" != "${GITHUB_SHA:-}" ]]; then
            reject "the candidate is not the commit this run is for (GITHUB_SHA)"
          fi
          if [[ "$candidate" != "${GITHUB_WORKFLOW_SHA:-}" ]]; then
            reject "the candidate is not the workflow revision running this gate (GITHUB_WORKFLOW_SHA)"
          fi
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "Validated candidate: $candidate"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          persist-credentials: false

      - name: Verify the exact candidate commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          tested="$(git rev-parse HEAD)"
          if [[ "$tested" != "$CANDIDATE_SHA" ]]; then
            echo "::error::checked out $tested but the candidate is $CANDIDATE_SHA"
            exit 1
          fi
          echo "Validated candidate: $CANDIDATE_SHA"
          echo "Tested commit: $tested"
          echo "Workflow definition: $GITHUB_WORKFLOW_REF at $GITHUB_WORKFLOW_SHA"
          {
            echo "Validated candidate: \`$CANDIDATE_SHA\`"
            echo "Tested commit: \`$tested\`"
            echo "Workflow definition: \`$GITHUB_WORKFLOW_REF\` at \`$GITHUB_WORKFLOW_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@4be4450ce7d4f1b9d3d643f42e0fe4124db1d31d # 1.94.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install ripgrep 14.1.1 and verify search backends
        shell: bash
        run: |
          cargo install ripgrep --version 14.1.1 --locked
          rg --version
          grep --version

      - name: Run tests
        run: cargo test --workspace --locked

      # P0-FINAL-GATE item D: the live native webview boundary harness (real
      # Wry runtime, production context and main-window builder, dev profile):
      # navigation and redirects to a non-app origin are refused, and a
      # non-app document gets no application command.
      - name: Live webview boundary harness (item D)
        shell: bash
        run: |
          set -o pipefail
          cargo test -p nexus-desktop-backend --locked --test webview_boundary_live -- --ignored 2>&1 | tee webview-boundary-live.log
          grep -q '^test webview_boundary_live ... ok$' webview-boundary-live.log

      # P0-002C4D2: assemble this target's packaged Builder toolchain, run the
      # trusted-entry tests with its own Node, and verify the real assembled
      # bytes through the embedded manifest (packaged backend test build).
      # P0-002C4C3: the same packaged build runs the governed dev-server launch
      # end to end (assembled Node, embedded manifest, Nexus entry, permission
      # model, sealed spawn, lifecycle ownership and the loopback preview).
      - name: Setup Node.js 24.21.0 (Builder toolchain assembly)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Assemble Nexus Builder toolchain
        shell: bash
        run: node packaging/builder-toolchain/scripts/assemble.mjs --target aarch64-apple-darwin --out app/src-tauri/builder-toolchain

      - name: Trusted Builder entry tests (packaged Node)
        shell: bash
        run: app/src-tauri/builder-toolchain/node/node --test packaging/builder-toolchain/test/entry.test.mjs

      - name: Packaged Builder toolchain verification and governed launch
        shell: bash
        env:
          NEXUS_BUILDER_TOOLCHAIN: packaged
        run: |
          set -o pipefail
          cargo test -p nexus-desktop-backend --locked --lib -- p0_002c4d2_assembled_ p0_002c4c3_packaged_ 2>&1 | tee packaged-toolchain.log
          grep -q 'test result: ok. 13 passed' packaged-toolchain.log

      # P0-FINAL-GATE item D: the same harness on tauri's release path
      # (custom-protocol build with the embedded frontend and production CSP).
      - name: Live webview boundary harness, release profile (item D)
        shell: bash
        run: |
          set -o pipefail
          (cd app && npm ci && npm run build)
          cargo test -p nexus-desktop-backend --locked --features tauri/custom-protocol --test webview_boundary_live -- --ignored 2>&1 | tee webview-boundary-live-release.log
          grep -q '^\[live\] tauri profile: release' webview-boundary-live-release.log
          grep -q '^test webview_boundary_live ... ok$' webview-boundary-live-release.log

  test-windows:
    runs-on: windows-latest
    steps:
      # Selects the one candidate this run may test, before checkout. The raw
      # dispatch input only reaches the shell as data, through the
      # environment; it is never interpolated or evaluated.
      - name: Select and validate the candidate commit
        id: candidate
        shell: bash
        env:
          RAW_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          reject() {
            echo "::error::$1"
            exit 1
          }
          case "${GITHUB_EVENT_NAME:-}" in
            workflow_dispatch)
              candidate="${RAW_CANDIDATE_SHA-}"
              ;;
            push)
              if [[ "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
                reject "push validation runs only for refs/heads/main"
              fi
              candidate="${GITHUB_SHA:-}"
              ;;
            *)
              reject "unsupported event for the final validation gate"
              ;;
          esac
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            reject "the candidate must be a full 40-character lowercase commit SHA"
          fi
          if [[ "$candidate" != "${GITHUB_SHA:-}" ]]; then
            reject "the candidate is not the commit this run is for (GITHUB_SHA)"
          fi
          if [[ "$candidate" != "${GITHUB_WORKFLOW_SHA:-}" ]]; then
            reject "the candidate is not the workflow revision running this gate (GITHUB_WORKFLOW_SHA)"
          fi
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "Validated candidate: $candidate"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          persist-credentials: false

      - name: Verify the exact candidate commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          tested="$(git rev-parse HEAD)"
          if [[ "$tested" != "$CANDIDATE_SHA" ]]; then
            echo "::error::checked out $tested but the candidate is $CANDIDATE_SHA"
            exit 1
          fi
          echo "Validated candidate: $CANDIDATE_SHA"
          echo "Tested commit: $tested"
          echo "Workflow definition: $GITHUB_WORKFLOW_REF at $GITHUB_WORKFLOW_SHA"
          {
            echo "Validated candidate: \`$CANDIDATE_SHA\`"
            echo "Tested commit: \`$tested\`"
            echo "Workflow definition: \`$GITHUB_WORKFLOW_REF\` at \`$GITHUB_WORKFLOW_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@4be4450ce7d4f1b9d3d643f42e0fe4124db1d31d # 1.94.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install ripgrep 14.1.1 and verify search backends
        shell: bash
        run: |
          cargo install ripgrep --version 14.1.1 --locked
          rg --version
          grep --version
          # Expose Git for Windows grep/which to the native Cargo test process.
          cygpath -w /usr/bin >> "$GITHUB_PATH"

      - name: Run tests
        run: cargo test --workspace --locked

      # P0-FINAL-GATE item D: the live native webview boundary harness (real
      # Wry runtime, production context and main-window builder, dev profile):
      # navigation and redirects to a non-app origin are refused, and a
      # non-app document gets no application command.
      - name: Live webview boundary harness (item D)
        shell: bash
        run: |
          set -o pipefail
          cargo test -p nexus-desktop-backend --locked --test webview_boundary_live -- --ignored 2>&1 | tee webview-boundary-live.log
          grep -q '^test webview_boundary_live ... ok$' webview-boundary-live.log

      # P0-002C4D2: assemble this target's packaged Builder toolchain, run the
      # trusted-entry tests with its own Node, and verify the real assembled
      # bytes through the embedded manifest (packaged backend test build).
      # P0-002C4C3: the same packaged build runs the governed dev-server launch
      # end to end (assembled Node, embedded manifest, Nexus entry, permission
      # model, sealed spawn, lifecycle ownership and the loopback preview).
      - name: Setup Node.js 24.21.0 (Builder toolchain assembly)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Assemble Nexus Builder toolchain
        shell: bash
        run: node packaging/builder-toolchain/scripts/assemble.mjs --target x86_64-pc-windows-msvc --out app/src-tauri/builder-toolchain

      - name: Trusted Builder entry tests (packaged Node)
        shell: bash
        run: app/src-tauri/builder-toolchain/node/node.exe --test packaging/builder-toolchain/test/entry.test.mjs

      - name: Packaged Builder toolchain verification and governed launch
        shell: bash
        env:
          NEXUS_BUILDER_TOOLCHAIN: packaged
        run: |
          set -o pipefail
          cargo test -p nexus-desktop-backend --locked --lib -- p0_002c4d2_assembled_ p0_002c4c3_packaged_ 2>&1 | tee packaged-toolchain.log
          grep -q 'test result: ok. 13 passed' packaged-toolchain.log

      # P0-FINAL-GATE item D: the same harness on tauri's release path
      # (custom-protocol build with the embedded frontend and production CSP).
      - name: Live webview boundary harness, release profile (item D)
        shell: bash
        run: |
          set -o pipefail
          (cd app && npm ci && npm run build)
          cargo test -p nexus-desktop-backend --locked --features tauri/custom-protocol --test webview_boundary_live -- --ignored 2>&1 | tee webview-boundary-live-release.log
          grep -q '^\[live\] tauri profile: release' webview-boundary-live-release.log
          grep -q '^test webview_boundary_live ... ok$' webview-boundary-live-release.log
