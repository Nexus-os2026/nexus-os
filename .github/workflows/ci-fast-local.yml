name: NEXUS OS Fast Local CI

# Primary Linux development gate, on the self-hosted Nexus runner. It runs the
# checks of the Linux Phase Zero final gate (ci.yml) with the same commands:
# Rust formatting, clippy and workspace tests, the Linux package inspection
# negative controls, and the Rust dependency gate. The Mother Nexus cleanup
# (2026-10-31) removed the old desktop app, frontend and Python voice
# service; their steps and jobs return with the Mother screen.
#
# This workflow is for speed. It is not the final evidence: the GitHub-hosted
# Linux Phase Zero gate in ci.yml is, run once on the candidate the Architect
# approves. The active Phase Zero target is Linux only; Windows and macOS
# validation is deferred (ci-portability.yml, manual only).
#
# Caches that are reused:
# - the runner's installed Rust 1.94.0 toolchain, called directly (never
#   through rustup, which could install toolchains);
# - one Cargo target directory kept outside the checkout; Cargo's
#   fingerprints decide what is rebuilt;
# - the runner's Cargo download cache, and versions pinned through the
#   runner tool cache.
# Everything else is rebuilt on every run from a cleaned checkout of the
# exact commit.
#
# It never runs for pull requests: the repository is public, and this runner
# is a self-hosted machine.
on:
  push:
    branches:
      - "implement/**"
      - "repair/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-local-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fast-linux:
    runs-on: [self-hosted, Linux, X64, nexus-local]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify the tested commit and a clean checkout
        shell: bash
        run: |
          set -euo pipefail
          tested="$(git rev-parse HEAD)"
          if [[ "$tested" != "$GITHUB_SHA" ]]; then
            echo "::error::checked out $tested but the event commit is $GITHUB_SHA"
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all --ignored)" ]]; then
            echo "::error::the checkout is not clean"
            git status --short --ignored
            exit 1
          fi
          echo "Tested commit: $tested"
          echo "Tested commit: \`$tested\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Use the runner's installed Rust 1.94.0 (no rustup, nothing installed)
        shell: bash
        run: |
          set -euo pipefail
          toolchain="${RUSTUP_HOME:-$HOME/.rustup}/toolchains/1.94.0-x86_64-unknown-linux-gnu/bin"
          for tool in cargo rustc rustdoc cargo-clippy clippy-driver cargo-fmt rustfmt; do
            if [[ ! -x "$toolchain/$tool" ]]; then
              echo "::error::$toolchain/$tool is missing: provision Rust 1.94.0 with rustfmt and clippy on this runner"
              exit 1
            fi
          done
          echo "$toolchain" >> "$GITHUB_PATH"

      - name: Verify the toolchain and the Tauri system libraries
        shell: bash
        run: |
          set -euo pipefail
          if ! rustc --version | grep -q '^rustc 1\.94\.0 '; then
            echo "::error::expected rustc 1.94.0, found: $(rustc --version)"
            exit 1
          fi
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version
          for lib in webkit2gtk-4.1 javascriptcoregtk-4.1 libsoup-3.0 gtk+-3.0 glib-2.0; do
            if ! pkg-config --exists "$lib"; then
              echo "::error::system library $lib is missing on this runner"
              exit 1
            fi
            echo "$lib $(pkg-config --modversion "$lib")"
          done

      - name: Use the persistent Cargo target cache (outside the checkout)
        shell: bash
        run: |
          set -euo pipefail
          cache="$(dirname "$GITHUB_WORKSPACE")/.nexus-fast-cache"
          mkdir -p "$cache/cargo-target" "$cache/tools"
          echo "NEXUS_FAST_CACHE=$cache" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$cache/cargo-target" >> "$GITHUB_ENV"

      # Privacy regressions exercise both real search backends.
      - name: Provide ripgrep 14.1.1 and verify search backends
        shell: bash
        run: |
          set -euo pipefail
          root="$NEXUS_FAST_CACHE/tools/ripgrep-14.1.1"
          if ! "$root/bin/rg" --version 2>/dev/null | head -n 1 | grep -q '^ripgrep 14\.1\.1 '; then
            rm -rf "$root"
            env -u CARGO_TARGET_DIR cargo install ripgrep --version 14.1.1 --locked --root "$root"
          fi
          echo "$root/bin" >> "$GITHUB_PATH"
          "$root/bin/rg" --version
          grep --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      # Phase Two (P2-R1): the release's Debian package inspection refuses
      # every deviation the Linux package must never ship.
      - name: Setup Node.js 24.21.0 (package inspection tests)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Linux package inspection negative controls
        shell: bash
        run: node --test packaging/verifier-toolchain/test/inspect-deb.test.mjs

      # Last step of fast-linux, so a dependency finding never hides the
      # other Linux evidence of the run.
      # P0-LINUX-FINAL-R1 repair B: the same Rust dependency gate as ci.yml.
      # The pinned scanners are installed with --locked once into the runner
      # tool cache (never the runner's ~/.cargo/bin); the advisory databases
      # are fetched fresh into this run's temporary directory. A vulnerability
      # outside deny.toml's exception set, a stale exception, or any install
      # or scanner failure fails the job.
      - name: Security gate (cargo-audit 0.22.1 and cargo-deny 0.19.6)
        shell: bash
        run: |
          set -euo pipefail
          root="$NEXUS_FAST_CACHE/tools/security-audit"
          if ! "$root/bin/cargo-audit" audit --version 2>/dev/null | grep -qx 'cargo-audit-audit 0\.22\.1'; then
            env -u CARGO_TARGET_DIR cargo install cargo-audit --version 0.22.1 --locked --force --root "$root"
          fi
          if ! "$root/bin/cargo-deny" --version 2>/dev/null | grep -qx 'cargo-deny 0\.19\.6'; then
            env -u CARGO_TARGET_DIR cargo install cargo-deny --version 0.19.6 --locked --force --root "$root"
          fi
          export PATH="$root/bin:$PATH"
          db="$RUNNER_TEMP/security-audit-db"
          rm -rf "$db"
          mkdir -p "$db"
          SECURITY_AUDIT_DB_ROOT="$db" scripts/security-audit.sh
