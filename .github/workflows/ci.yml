name: Phase 0 Windows handle diagnostics
on:
  push:
    branches:
      - diagnostic/p0-ci-windows-handle-count
jobs:
  handles:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Compile focused native test
        run: cargo test -p nexus-kernel --test resource_limiter_integration_tests --locked --no-run
      - name: Isolated repetitions
        continue-on-error: true
        shell: pwsh
        run: |
          $failed = 0
          1..5 | ForEach-Object {
            Write-Output "ISOLATED $_"
            cargo test -p nexus-kernel --test resource_limiter_integration_tests --locked spawn_failures_release_resources_and_allow_subsequent_execution -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          Write-Output "ISOLATED_FAILURES=$failed"
          if ($failed -gt 0) { exit 1 }
      - name: Parallel harness repetitions
        continue-on-error: true
        shell: pwsh
        run: |
          $failed = 0
          1..5 | ForEach-Object {
            Write-Output "PARALLEL $_"
            cargo test -p nexus-kernel --test resource_limiter_integration_tests --locked -- --nocapture
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          Write-Output "PARALLEL_FAILURES=$failed"
          if ($failed -gt 0) { exit 1 }
      - name: Serial harness repetitions
        continue-on-error: true
        shell: pwsh
        run: |
          $failed = 0
          1..5 | ForEach-Object {
            Write-Output "SERIAL $_"
            cargo test -p nexus-kernel --test resource_limiter_integration_tests --locked -- --test-threads=1 --nocapture
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          Write-Output "SERIAL_FAILURES=$failed"
          if ($failed -gt 0) { exit 1 }
