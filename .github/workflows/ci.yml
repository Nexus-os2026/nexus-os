name: NEXUS OS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            glib-2.0 \
            pkg-config

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # Privacy regressions exercise both real search backends.
      - name: Install ripgrep 14.1.1 and verify search backends
        shell: bash
        run: |
          cargo install ripgrep --version 14.1.1 --locked
          rg --version
          grep --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      # P0-002C4D2: assemble this target's packaged Builder toolchain, run the
      # trusted-entry tests with its own Node, and verify the real assembled
      # bytes through the embedded manifest (packaged backend test build).
      - name: Setup Node.js 24.21.0 (Builder toolchain assembly)
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Assemble Nexus Builder toolchain
        shell: bash
        run: node packaging/builder-toolchain/scripts/assemble.mjs --target x86_64-unknown-linux-gnu --out app/src-tauri/builder-toolchain

      - name: Trusted Builder entry tests (packaged Node)
        shell: bash
        run: app/src-tauri/builder-toolchain/node/node --test packaging/builder-toolchain/test/entry.test.mjs

      - name: Packaged Builder toolchain verification
        shell: bash
        env:
          NEXUS_BUILDER_TOOLCHAIN: packaged
        run: |
          cargo test -p nexus-desktop-backend --locked --lib p0_002c4d2_assembled_ 2>&1 | tee packaged-toolchain.log
          grep -q 'test result: ok. 2 passed' packaged-toolchain.log

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: cd app && npm ci

      - name: TypeScript check
        run: cd app && npx tsc --noEmit

      - name: Run frontend tests
        run: cd app && npm test

      - name: Build frontend
        run: cd app && npx vite build

  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install ripgrep 14.1.1 and verify search backends
        shell: bash
        run: |
          cargo install ripgrep --version 14.1.1 --locked
          rg --version
          grep --version

      - name: Run tests
        run: cargo test --workspace --locked

      # P0-002C4D2: assemble this target's packaged Builder toolchain, run the
      # trusted-entry tests with its own Node, and verify the real assembled
      # bytes through the embedded manifest (packaged backend test build).
      - name: Setup Node.js 24.21.0 (Builder toolchain assembly)
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Assemble Nexus Builder toolchain
        shell: bash
        run: node packaging/builder-toolchain/scripts/assemble.mjs --target aarch64-apple-darwin --out app/src-tauri/builder-toolchain

      - name: Trusted Builder entry tests (packaged Node)
        shell: bash
        run: app/src-tauri/builder-toolchain/node/node --test packaging/builder-toolchain/test/entry.test.mjs

      - name: Packaged Builder toolchain verification
        shell: bash
        env:
          NEXUS_BUILDER_TOOLCHAIN: packaged
        run: |
          cargo test -p nexus-desktop-backend --locked --lib p0_002c4d2_assembled_ 2>&1 | tee packaged-toolchain.log
          grep -q 'test result: ok. 2 passed' packaged-toolchain.log

  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install ripgrep 14.1.1 and verify search backends
        shell: bash
        run: |
          cargo install ripgrep --version 14.1.1 --locked
          rg --version
          grep --version
          # Expose Git for Windows grep/which to the native Cargo test process.
          cygpath -w /usr/bin >> "$GITHUB_PATH"

      - name: Run tests
        run: cargo test --workspace --locked

      # P0-002C4D2: assemble this target's packaged Builder toolchain, run the
      # trusted-entry tests with its own Node, and verify the real assembled
      # bytes through the embedded manifest (packaged backend test build).
      - name: Setup Node.js 24.21.0 (Builder toolchain assembly)
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Assemble Nexus Builder toolchain
        shell: bash
        run: node packaging/builder-toolchain/scripts/assemble.mjs --target x86_64-pc-windows-msvc --out app/src-tauri/builder-toolchain

      - name: Trusted Builder entry tests (packaged Node)
        shell: bash
        run: app/src-tauri/builder-toolchain/node/node.exe --test packaging/builder-toolchain/test/entry.test.mjs

      - name: Packaged Builder toolchain verification
        shell: bash
        env:
          NEXUS_BUILDER_TOOLCHAIN: packaged
        run: |
          cargo test -p nexus-desktop-backend --locked --lib p0_002c4d2_assembled_ 2>&1 | tee packaged-toolchain.log
          grep -q 'test result: ok. 2 passed' packaged-toolchain.log

  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            glib-2.0 \
            pkg-config

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install voice dependencies
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper openwakeword silero-vad piper-tts pytest

      - name: Run Python voice tests
        run: cd voice && python -m pytest -v
