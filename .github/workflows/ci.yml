name: NEXUS R6 native containment diagnostic
on:
  push:
    branches: [diagnostic/p0-ci-r6-final-environment]
env:
  CARGO_TERM_COLOR: always
jobs:
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Standard runner search backends
        shell: bash
        run: |
          cargo install ripgrep --version 14.1.1 --locked
          cygpath -w /usr/bin >> "$GITHUB_PATH"
      - name: Native strict clippy
        continue-on-error: true
        run: cargo clippy -p nexus-kernel --all-targets --all-features --locked -- -D warnings
      - name: Native kernel and containment inventory
        continue-on-error: true
        run: cargo test -p nexus-kernel --locked --no-fail-fast
      - name: Node path representation probe
        run: cargo test -p nexus-kernel --lib --locked node_path_forms -- --nocapture
