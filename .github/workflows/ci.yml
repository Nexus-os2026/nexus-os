name: NEXUS OS CI

# Linux final gate (GitHub-hosted): Linux Rust (fmt, clippy, workspace
# tests) and the pinned dependency security gate (security-audit-linux).
# The Mother Nexus cleanup (2026-10-31) removed the old desktop app, its
# frontend and the Python voice service, so their jobs and the desktop
# webview/Builder-toolchain steps went with them; they are recoverable from
# the archive/nexus-before-mother tag and return with the Mother screen.
# The active target is Linux only.
#
# Run it explicitly, once, on the Architect-approved candidate, from a branch
# whose head is that candidate:
#   gh workflow run ci.yml --ref <branch> -f candidate_sha=<full 40-char SHA>
# Every job first checks, before checkout, that the candidate is a full
# lowercase SHA and equals both the commit the run was dispatched for
# (GITHUB_SHA) and the workflow revision executing the gate
# (GITHUB_WORKFLOW_SHA). A push to main uses the pushed commit the same way.
# Every job then checks out exactly that commit and fails if it tested
# anything else. These checks establish revision identity only; they do not
# approve or integrate anything. Day-to-day development validation runs on
# the self-hosted runner (ci-fast-local.yml); it does not replace this gate.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full 40-character SHA of the Architect-approved candidate commit"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      # Selects the one candidate this run may test, before checkout. The raw
      # dispatch input only reaches the shell as data, through the
      # environment; it is never interpolated or evaluated.
      - name: Select and validate the candidate commit
        id: candidate
        shell: bash
        env:
          RAW_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          reject() {
            echo "::error::$1"
            exit 1
          }
          case "${GITHUB_EVENT_NAME:-}" in
            workflow_dispatch)
              candidate="${RAW_CANDIDATE_SHA-}"
              ;;
            push)
              if [[ "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
                reject "push validation runs only for refs/heads/main"
              fi
              candidate="${GITHUB_SHA:-}"
              ;;
            *)
              reject "unsupported event for the final validation gate"
              ;;
          esac
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            reject "the candidate must be a full 40-character lowercase commit SHA"
          fi
          if [[ "$candidate" != "${GITHUB_SHA:-}" ]]; then
            reject "the candidate is not the commit this run is for (GITHUB_SHA)"
          fi
          if [[ "$candidate" != "${GITHUB_WORKFLOW_SHA:-}" ]]; then
            reject "the candidate is not the workflow revision running this gate (GITHUB_WORKFLOW_SHA)"
          fi
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "Validated candidate: $candidate"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          persist-credentials: false

      - name: Verify the exact candidate commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          tested="$(git rev-parse HEAD)"
          if [[ "$tested" != "$CANDIDATE_SHA" ]]; then
            echo "::error::checked out $tested but the candidate is $CANDIDATE_SHA"
            exit 1
          fi
          echo "Validated candidate: $CANDIDATE_SHA"
          echo "Tested commit: $tested"
          echo "Workflow definition: $GITHUB_WORKFLOW_REF at $GITHUB_WORKFLOW_SHA"
          {
            echo "Validated candidate: \`$CANDIDATE_SHA\`"
            echo "Tested commit: \`$tested\`"
            echo "Workflow definition: \`$GITHUB_WORKFLOW_REF\` at \`$GITHUB_WORKFLOW_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # espeak-ng: the governed speech tool's live test runs here, and fails
      # rather than skips under CI if the engine is missing.
      # M2b-A, Mother's desktop: libgtk-4-dev builds gtk4; xdotool delivers
      # the live tests' real XTest input; dbus provides the private session
      # bus (dbus-daemon) of G13; libglib2.0-bin provides `gdbus introspect`;
      # gvfs is GIO's vfs module, which opens the desktop's session-bus
      # connection on an Ubuntu desktop: without it the runner's desktop
      # holds no connection, and G13 (which requires one) would check nothing.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            glib-2.0 \
            pkg-config \
            xvfb \
            espeak-ng \
            libgtk-4-dev \
            xdotool \
            dbus \
            libglib2.0-bin \
            gvfs

      # The runner image makes /opt world-writable (`chmod -R 777 /opt`), and
      # the governed browser refuses a Chrome that anyone but root could
      # replace. Restore the package's modes so the live browser tests drive
      # it, and fail here if any part of its path is still not root-only.
      - name: Restore Chrome's packaged permissions (governed browser)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo chmod 0755 /opt /opt/google
          sudo chmod -R go-w /opt/google/chrome
          sudo chmod 4755 /opt/google/chrome/chrome-sandbox
          for path in / /opt /opt/google /opt/google/chrome /opt/google/chrome/chrome /opt/google/chrome/chrome-sandbox; do
            stat -c '%n owner=%U mode=%a' "$path"
            if [[ $(stat -c %u "$path") != 0 ]] || (( 0$(stat -c %a "$path") & 022 )); then
              echo "::error::$path is not root-only"
              exit 1
            fi
          done

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@4be4450ce7d4f1b9d3d643f42e0fe4124db1d31d # 1.94.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Privacy regressions exercise both real search backends.
      - name: Install ripgrep 14.1.1 and verify search backends
        shell: bash
        run: |
          cargo install ripgrep --version 14.1.1 --locked
          rg --version
          grep --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # M2b-A G0: the desktop tripwire reads the resolved graph with
      # `cargo metadata --locked --offline` over every target. A Linux build
      # downloads only the packages Linux needs, so fetch every locked
      # package first; a missing one would fail the guard (it fails closed).
      - name: Fetch every locked package (the G0 tripwire reads them offline)
        run: cargo fetch --locked

      - name: Run tests
        run: cargo test --workspace --locked

      # M2b-A: the desktop's live tests again, each required by name. Every
      # live test re-runs itself in an isolated child on its own Xvfb and
      # reads the child's report strictly; here each must print its own
      # `ok` line, so none can pass by not running.
      - name: Mother's desktop live tests, each ok line required
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p nexus-mother-desktop --locked --test live -- --list \
            | sed -n 's/: test$//p' > live-tests.txt
          count="$(wc -l < live-tests.txt)"
          if (( count < 14 )); then
            echo "::error::expected at least 14 live tests, found $count"
            exit 1
          fi
          cargo test -p nexus-mother-desktop --locked --test live 2>&1 | tee live.log
          missing=0
          while read -r name; do
            if ! grep -qx "test $name ... ok" live.log; then
              echo "::error::live test $name did not report ok"
              missing=1
            fi
          done < live-tests.txt
          exit "$missing"

  # P0-LINUX-FINAL-R1 repair B: the Rust dependency gate on the candidate
  # itself. scripts/security-audit.sh installs the pinned cargo-audit 0.22.1
  # and cargo-deny 0.19.6 with --locked, and scans the candidate's Cargo.lock
  # with deny.toml's one exception set against freshly fetched advisory
  # databases. A vulnerability outside the set, a stale exception, or any
  # install or scanner failure fails the gate.
  security-audit-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Select and validate the candidate commit
        id: candidate
        shell: bash
        env:
          RAW_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          reject() {
            echo "::error::$1"
            exit 1
          }
          case "${GITHUB_EVENT_NAME:-}" in
            workflow_dispatch)
              candidate="${RAW_CANDIDATE_SHA-}"
              ;;
            push)
              if [[ "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
                reject "push validation runs only for refs/heads/main"
              fi
              candidate="${GITHUB_SHA:-}"
              ;;
            *)
              reject "unsupported event for the final validation gate"
              ;;
          esac
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            reject "the candidate must be a full 40-character lowercase commit SHA"
          fi
          if [[ "$candidate" != "${GITHUB_SHA:-}" ]]; then
            reject "the candidate is not the commit this run is for (GITHUB_SHA)"
          fi
          if [[ "$candidate" != "${GITHUB_WORKFLOW_SHA:-}" ]]; then
            reject "the candidate is not the workflow revision running this gate (GITHUB_WORKFLOW_SHA)"
          fi
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "Validated candidate: $candidate"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          persist-credentials: false

      - name: Verify the exact candidate commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          tested="$(git rev-parse HEAD)"
          if [[ "$tested" != "$CANDIDATE_SHA" ]]; then
            echo "::error::checked out $tested but the candidate is $CANDIDATE_SHA"
            exit 1
          fi
          echo "Validated candidate: $CANDIDATE_SHA"
          echo "Tested commit: $tested"
          echo "Workflow definition: $GITHUB_WORKFLOW_REF at $GITHUB_WORKFLOW_SHA"
          {
            echo "Validated candidate: \`$CANDIDATE_SHA\`"
            echo "Tested commit: \`$tested\`"
            echo "Workflow definition: \`$GITHUB_WORKFLOW_REF\` at \`$GITHUB_WORKFLOW_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@4be4450ce7d4f1b9d3d643f42e0fe4124db1d31d # 1.94.0

      - name: Use fresh advisory databases
        run: rm -rf ~/.cargo/advisory-db ~/.cargo/advisory-dbs

      - name: Security gate exception-list test
        run: scripts/tests/security-audit-exceptions.sh

      - name: Security gate (cargo-audit and cargo-deny)
        run: scripts/security-audit.sh --install

  # SB-3E route cells (design 1.3 and section 5 A7, as amended by AM-1): A7
  # (both builds from clean at one path) then the lane in a fresh target, both
  # with the pinned toolchain under a clean launch block. Candidate's own
  # tools and pins: not the authority until GB1.
  route-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Select and validate the candidate commit
        id: candidate
        shell: bash
        env:
          RAW_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          reject() {
            echo "::error::$1"
            exit 1
          }
          case "${GITHUB_EVENT_NAME:-}" in
            workflow_dispatch)
              candidate="${RAW_CANDIDATE_SHA-}"
              ;;
            push)
              if [[ "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
                reject "push validation runs only for refs/heads/main"
              fi
              candidate="${GITHUB_SHA:-}"
              ;;
            *)
              reject "unsupported event for the final validation gate"
              ;;
          esac
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            reject "the candidate must be a full 40-character lowercase commit SHA"
          fi
          if [[ "$candidate" != "${GITHUB_SHA:-}" ]]; then
            reject "the candidate is not the commit this run is for (GITHUB_SHA)"
          fi
          if [[ "$candidate" != "${GITHUB_WORKFLOW_SHA:-}" ]]; then
            reject "the candidate is not the workflow revision running this gate (GITHUB_WORKFLOW_SHA)"
          fi
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "Validated candidate: $candidate"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          persist-credentials: false

      - name: Verify the exact candidate commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          tested="$(git rev-parse HEAD)"
          if [[ "$tested" != "$CANDIDATE_SHA" ]]; then
            echo "::error::checked out $tested but the candidate is $CANDIDATE_SHA"
            exit 1
          fi
          echo "Validated candidate: $CANDIDATE_SHA"
          echo "Tested commit: $tested"
          echo "Workflow definition: $GITHUB_WORKFLOW_REF at $GITHUB_WORKFLOW_SHA"
          {
            echo "Validated candidate: \`$CANDIDATE_SHA\`"
            echo "Tested commit: \`$tested\`"
            echo "Workflow definition: \`$GITHUB_WORKFLOW_REF\` at \`$GITHUB_WORKFLOW_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@4be4450ce7d4f1b9d3d643f42e0fe4124db1d31d # 1.94.0

      - name: Install the desktop's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config libc6-dev

      - name: Build the route wrapper
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -static \
            -o "$RUNNER_TEMP/route_rustc" tools/gatebox/route/route_rustc.c

      - name: A7 compile-input agreement (both builds, fresh target)
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(rustc --print sysroot)"
          wrapper="$RUNNER_TEMP/route_rustc"
          env -i HOME="$HOME" PATH=/usr/bin:/bin LANG=C.UTF-8 \
            /usr/bin/python3 -I tools/gatebox/route/route_a7.py run \
            --repo "$PWD" --toolchain "$toolchain" \
            --target "$RUNNER_TEMP/route-a7/target" \
            --evidence "$RUNNER_TEMP/route-a7/evidence" \
            --wrapper "$wrapper" --wrapper-sha256 "$(sha256sum "$wrapper" | cut -d' ' -f1)" \
            --json "$RUNNER_TEMP/route-a7/verdict.json"

      - name: Route lane (fresh target)
        shell: bash
        run: |
          set -euo pipefail
          env -i HOME="$HOME" PATH=/usr/bin:/bin LANG=C.UTF-8 \
            /usr/bin/python3 -I tools/gatebox/route/route_a7.py lane \
            --repo "$PWD" --toolchain "$(rustc --print sysroot)" \
            --target "$RUNNER_TEMP/route-lane" --wrapper "$RUNNER_TEMP/route_rustc"
