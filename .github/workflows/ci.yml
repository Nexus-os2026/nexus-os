name: NEXUS OS CI

# Linux Phase Zero final gate (GitHub-hosted): Linux Rust (fmt, clippy,
# workspace tests, the live webview boundary harness in the dev and release
# profiles, the packaged Builder toolchain and governed launch), the pinned
# dependency security gate (security-audit-linux), frontend and Python voice.
# The active Phase Zero target is Linux only; Windows and macOS
# validation is deferred and preserved, manual-only, in ci-portability.yml.
#
# Run it explicitly, once, on the Architect-approved candidate, from a branch
# whose head is that candidate:
#   gh workflow run ci.yml --ref <branch> -f candidate_sha=<full 40-char SHA>
# Every job first checks, before checkout, that the candidate is a full
# lowercase SHA and equals both the commit the run was dispatched for
# (GITHUB_SHA) and the workflow revision executing the gate
# (GITHUB_WORKFLOW_SHA). A push to main uses the pushed commit the same way.
# Every job then checks out exactly that commit and fails if it tested
# anything else. These checks establish revision identity only; they do not
# approve or integrate anything. Day-to-day development validation runs on
# the self-hosted runner (ci-fast-local.yml); it does not replace this gate.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full 40-character SHA of the Architect-approved candidate commit"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      # Selects the one candidate this run may test, before checkout. The raw
      # dispatch input only reaches the shell as data, through the
      # environment; it is never interpolated or evaluated.
      - name: Select and validate the candidate commit
        id: candidate
        shell: bash
        env:
          RAW_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          reject() {
            echo "::error::$1"
            exit 1
          }
          case "${GITHUB_EVENT_NAME:-}" in
            workflow_dispatch)
              candidate="${RAW_CANDIDATE_SHA-}"
              ;;
            push)
              if [[ "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
                reject "push validation runs only for refs/heads/main"
              fi
              candidate="${GITHUB_SHA:-}"
              ;;
            *)
              reject "unsupported event for the final validation gate"
              ;;
          esac
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            reject "the candidate must be a full 40-character lowercase commit SHA"
          fi
          if [[ "$candidate" != "${GITHUB_SHA:-}" ]]; then
            reject "the candidate is not the commit this run is for (GITHUB_SHA)"
          fi
          if [[ "$candidate" != "${GITHUB_WORKFLOW_SHA:-}" ]]; then
            reject "the candidate is not the workflow revision running this gate (GITHUB_WORKFLOW_SHA)"
          fi
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "Validated candidate: $candidate"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          persist-credentials: false

      - name: Verify the exact candidate commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          tested="$(git rev-parse HEAD)"
          if [[ "$tested" != "$CANDIDATE_SHA" ]]; then
            echo "::error::checked out $tested but the candidate is $CANDIDATE_SHA"
            exit 1
          fi
          echo "Validated candidate: $CANDIDATE_SHA"
          echo "Tested commit: $tested"
          echo "Workflow definition: $GITHUB_WORKFLOW_REF at $GITHUB_WORKFLOW_SHA"
          {
            echo "Validated candidate: \`$CANDIDATE_SHA\`"
            echo "Tested commit: \`$tested\`"
            echo "Workflow definition: \`$GITHUB_WORKFLOW_REF\` at \`$GITHUB_WORKFLOW_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            glib-2.0 \
            pkg-config \
            xvfb

      # The runner image makes /opt world-writable (`chmod -R 777 /opt`), and
      # the governed browser refuses a Chrome that anyone but root could
      # replace. Restore the package's modes so the live browser tests drive
      # it, and fail here if any part of its path is still not root-only.
      - name: Restore Chrome's packaged permissions (governed browser)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo chmod 0755 /opt /opt/google
          sudo chmod -R go-w /opt/google/chrome
          sudo chmod 4755 /opt/google/chrome/chrome-sandbox
          for path in / /opt /opt/google /opt/google/chrome /opt/google/chrome/chrome /opt/google/chrome/chrome-sandbox; do
            stat -c '%n owner=%U mode=%a' "$path"
            if [[ $(stat -c %u "$path") != 0 ]] || (( 0$(stat -c %a "$path") & 022 )); then
              echo "::error::$path is not root-only"
              exit 1
            fi
          done

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@4be4450ce7d4f1b9d3d643f42e0fe4124db1d31d # 1.94.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Privacy regressions exercise both real search backends.
      - name: Install ripgrep 14.1.1 and verify search backends
        shell: bash
        run: |
          cargo install ripgrep --version 14.1.1 --locked
          rg --version
          grep --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      # P0-FINAL-GATE item D: the live native webview boundary harness (real
      # Wry runtime, production context and main-window builder, dev profile):
      # navigation and redirects to a non-app origin are refused, and a
      # non-app document gets no application command.
      - name: Live webview boundary harness (item D)
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" cargo test -p nexus-desktop-backend --locked --test webview_boundary_live -- --ignored 2>&1 | tee webview-boundary-live.log
          grep -q '^test webview_boundary_live ... ok$' webview-boundary-live.log

      # P0-002C4D2: assemble this target's packaged Builder toolchain, run the
      # trusted-entry tests with its own Node, and verify the real assembled
      # bytes through the embedded manifest (packaged backend test build).
      # P0-002C4C3: the same packaged build runs the governed dev-server launch
      # end to end (assembled Node, embedded manifest, Nexus entry, permission
      # model, sealed spawn, lifecycle ownership and the loopback preview).
      - name: Setup Node.js 24.21.0 (Builder toolchain assembly)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Assemble Nexus Builder toolchain
        shell: bash
        run: node packaging/builder-toolchain/scripts/assemble.mjs --target x86_64-unknown-linux-gnu --out app/src-tauri/builder-toolchain

      - name: Trusted Builder entry tests (packaged Node)
        shell: bash
        run: app/src-tauri/builder-toolchain/node/node --test packaging/builder-toolchain/test/entry.test.mjs

      - name: Packaged Builder toolchain verification and governed launch
        shell: bash
        env:
          NEXUS_BUILDER_TOOLCHAIN: packaged
        run: |
          set -o pipefail
          cargo test -p nexus-desktop-backend --locked --lib -- p0_002c4d2_assembled_ p0_002c4c3_packaged_ 2>&1 | tee packaged-toolchain.log
          grep -q 'test result: ok. 13 passed' packaged-toolchain.log

      # P0-FINAL-GATE item D: the same harness on tauri's release path
      # (custom-protocol build with the embedded frontend and production CSP).
      - name: Live webview boundary harness, release profile (item D)
        shell: bash
        run: |
          set -o pipefail
          (cd app && npm ci && npm run build)
          xvfb-run -a -s "-screen 0 1280x1024x24" cargo test -p nexus-desktop-backend --locked --features tauri/custom-protocol --test webview_boundary_live -- --ignored 2>&1 | tee webview-boundary-live-release.log
          grep -q '^\[live\] tauri profile: release' webview-boundary-live-release.log
          grep -q '^test webview_boundary_live ... ok$' webview-boundary-live-release.log

  # P0-LINUX-FINAL-R1 repair B: the Rust dependency gate on the candidate
  # itself. scripts/security-audit.sh installs the pinned cargo-audit 0.22.1
  # and cargo-deny 0.19.6 with --locked, and scans the candidate's Cargo.lock
  # with deny.toml's one exception set against freshly fetched advisory
  # databases. A vulnerability outside the set, a stale exception, or any
  # install or scanner failure fails the gate.
  security-audit-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Select and validate the candidate commit
        id: candidate
        shell: bash
        env:
          RAW_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          reject() {
            echo "::error::$1"
            exit 1
          }
          case "${GITHUB_EVENT_NAME:-}" in
            workflow_dispatch)
              candidate="${RAW_CANDIDATE_SHA-}"
              ;;
            push)
              if [[ "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
                reject "push validation runs only for refs/heads/main"
              fi
              candidate="${GITHUB_SHA:-}"
              ;;
            *)
              reject "unsupported event for the final validation gate"
              ;;
          esac
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            reject "the candidate must be a full 40-character lowercase commit SHA"
          fi
          if [[ "$candidate" != "${GITHUB_SHA:-}" ]]; then
            reject "the candidate is not the commit this run is for (GITHUB_SHA)"
          fi
          if [[ "$candidate" != "${GITHUB_WORKFLOW_SHA:-}" ]]; then
            reject "the candidate is not the workflow revision running this gate (GITHUB_WORKFLOW_SHA)"
          fi
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "Validated candidate: $candidate"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          persist-credentials: false

      - name: Verify the exact candidate commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          tested="$(git rev-parse HEAD)"
          if [[ "$tested" != "$CANDIDATE_SHA" ]]; then
            echo "::error::checked out $tested but the candidate is $CANDIDATE_SHA"
            exit 1
          fi
          echo "Validated candidate: $CANDIDATE_SHA"
          echo "Tested commit: $tested"
          echo "Workflow definition: $GITHUB_WORKFLOW_REF at $GITHUB_WORKFLOW_SHA"
          {
            echo "Validated candidate: \`$CANDIDATE_SHA\`"
            echo "Tested commit: \`$tested\`"
            echo "Workflow definition: \`$GITHUB_WORKFLOW_REF\` at \`$GITHUB_WORKFLOW_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@4be4450ce7d4f1b9d3d643f42e0fe4124db1d31d # 1.94.0

      - name: Use fresh advisory databases
        run: rm -rf ~/.cargo/advisory-db ~/.cargo/advisory-dbs

      - name: Security gate (cargo-audit and cargo-deny)
        run: scripts/security-audit.sh --install

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      # Selects the one candidate this run may test, before checkout. The raw
      # dispatch input only reaches the shell as data, through the
      # environment; it is never interpolated or evaluated.
      - name: Select and validate the candidate commit
        id: candidate
        shell: bash
        env:
          RAW_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          reject() {
            echo "::error::$1"
            exit 1
          }
          case "${GITHUB_EVENT_NAME:-}" in
            workflow_dispatch)
              candidate="${RAW_CANDIDATE_SHA-}"
              ;;
            push)
              if [[ "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
                reject "push validation runs only for refs/heads/main"
              fi
              candidate="${GITHUB_SHA:-}"
              ;;
            *)
              reject "unsupported event for the final validation gate"
              ;;
          esac
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            reject "the candidate must be a full 40-character lowercase commit SHA"
          fi
          if [[ "$candidate" != "${GITHUB_SHA:-}" ]]; then
            reject "the candidate is not the commit this run is for (GITHUB_SHA)"
          fi
          if [[ "$candidate" != "${GITHUB_WORKFLOW_SHA:-}" ]]; then
            reject "the candidate is not the workflow revision running this gate (GITHUB_WORKFLOW_SHA)"
          fi
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "Validated candidate: $candidate"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          persist-credentials: false

      - name: Verify the exact candidate commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          tested="$(git rev-parse HEAD)"
          if [[ "$tested" != "$CANDIDATE_SHA" ]]; then
            echo "::error::checked out $tested but the candidate is $CANDIDATE_SHA"
            exit 1
          fi
          echo "Validated candidate: $CANDIDATE_SHA"
          echo "Tested commit: $tested"
          echo "Workflow definition: $GITHUB_WORKFLOW_REF at $GITHUB_WORKFLOW_SHA"
          {
            echo "Validated candidate: \`$CANDIDATE_SHA\`"
            echo "Tested commit: \`$tested\`"
            echo "Workflow definition: \`$GITHUB_WORKFLOW_REF\` at \`$GITHUB_WORKFLOW_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # XA-R4C: the npm advisory gate runs before any frontend dependency is
      # installed: its own tests, then a fresh `npm audit` of every audited
      # npm root against security/npm-advisory-policy.json. An advisory the
      # policy's one exact exception does not match, a stale or expired
      # exception, an unknown or reactivated npm root, or any audit failure
      # fails the job.
      - name: npm advisory gate tests
        run: node --test scripts/ci/npm-advisory-gate.test.mjs

      - name: npm advisory gate (audited npm roots)
        run: node scripts/ci/npm-advisory-gate.mjs

      - name: Install frontend dependencies
        run: cd app && npm ci

      - name: TypeScript check
        run: cd app && npx tsc --noEmit

      - name: Run frontend tests
        run: cd app && npm test

      - name: Build frontend
        run: cd app && npx vite build

  test-python:
    runs-on: ubuntu-latest
    steps:
      # Selects the one candidate this run may test, before checkout. The raw
      # dispatch input only reaches the shell as data, through the
      # environment; it is never interpolated or evaluated.
      - name: Select and validate the candidate commit
        id: candidate
        shell: bash
        env:
          RAW_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          reject() {
            echo "::error::$1"
            exit 1
          }
