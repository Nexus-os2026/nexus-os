          fi
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "Validated candidate: $candidate"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          persist-credentials: false

      - name: Verify the exact candidate commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          tested="$(git rev-parse HEAD)"
          if [[ "$tested" != "$CANDIDATE_SHA" ]]; then
            echo "::error::checked out $tested but the candidate is $CANDIDATE_SHA"
            exit 1
          fi
          echo "Validated candidate: $CANDIDATE_SHA"
          echo "Tested commit: $tested"
          echo "Workflow definition: $GITHUB_WORKFLOW_REF at $GITHUB_WORKFLOW_SHA"
          {
            echo "Validated candidate: \`$CANDIDATE_SHA\`"
            echo "Tested commit: \`$tested\`"
            echo "Workflow definition: \`$GITHUB_WORKFLOW_REF\` at \`$GITHUB_WORKFLOW_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            glib-2.0 \
            pkg-config

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # The committed, complete, hash-pinned Linux/Python 3.11 set: nothing
      # is resolved at install time and every downloaded file must match.
      - name: Install voice dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-deps -r voice/pip-bootstrap.lock
          python -m pip install --require-hashes --no-deps -r voice/requirements-linux-py311.lock
          python -m pip check

      - name: Run Python voice tests
        run: cd voice && python -m pytest -v
