name: Phase 0 R7 fixture frontier

on:
  push:
    branches:
      - diagnostic/p0-ci-r7-fixture-frontier

env:
  CARGO_TERM_COLOR: always

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install ripgrep 14.1.1 and verify search backends
        shell: bash
        run: |
          cargo install ripgrep --version 14.1.1 --locked
          rg --version
          grep --version

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast

  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install ripgrep 14.1.1 and verify search backends
        shell: bash
        run: |
          cargo install ripgrep --version 14.1.1 --locked
          rg --version
          grep --version
          # Expose Git for Windows grep/which to the native Cargo test process.
          cygpath -w /usr/bin >> "$GITHUB_PATH"

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast
