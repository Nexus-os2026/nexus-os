name: R6 Bash temporary path diagnostic
on:
  push:
    branches: [diagnostic/p0-ci-r6-bash-temporary-paths]
env:
  CARGO_TERM_COLOR: always
jobs:
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Match standard Windows search backend PATH
        shell: bash
        run: cygpath -w /usr/bin >> "$GITHUB_PATH"
      - name: Compare owned Bash child temporary path representations
        run: cargo test -p nexus-kernel --lib --locked bash_temp_environment_probe -- --nocapture
