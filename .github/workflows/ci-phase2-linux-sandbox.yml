name: NEXUS OS Phase Two Linux Sandbox

# Phase Two (governed verification execution): the supported-host evidence.
# It runs the complete live Phase Two isolation, escape and cleanup suite
# against one exact candidate commit on the self-hosted Nexus runner, with
# every layer required. If this host cannot provide one (unprivileged user,
# PID, network, IPC, UTS and cgroup namespaces; Landlock ABI >= 6; the seccomp
# allow-list; cgroup v2 limits delegated through the runner user's systemd
# user manager; a private /run/user/<uid>; the unified cgroup v2
# hierarchy), the job fails. There is no degraded mode and no skipped case:
# the suite runs with NEXUS_PHASE2_REQUIRE_LIVE_SANDBOX=1 and the passed-case
# count is checked.
#
# The suite includes the supported-host qualification of the native scope
# mechanism (P2-V1-R3B-I4-Q1, G-HOST H1 to H7): the real user manager's
# bus, the live helper's unified cgroup membership, the manager's unit Id and
# ControlGroup bound to that membership, the runtime properties, the exact
# NoSuchUnit and UnitExists answers, and a killed, unreaped helper's
# membership; a passing run means the manager/native binding held on this
# host. Host and version facts are printed as evidence only.
#
# It never runs for pull requests or pushes (the repository is public and
# this runner is a self-hosted machine): only by dispatch, on the ref whose
# head is the candidate, with that exact candidate SHA.
#
# Caches that are reused: the runner's installed Rust 1.94.0 toolchain (called
# directly, never through rustup) and the Cargo target directory kept outside
# the checkout. The checkout is clean, and the verifier toolchain is assembled
# fresh from the pinned official Rust archives (assemble.mjs checks every
# digest and refuses an existing output directory).
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character candidate commit (the head of the dispatched ref)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase2-linux-sandbox
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  phase2-linux-sandbox:
    runs-on: [self-hosted, Linux, X64, nexus-local]
    timeout-minutes: 120
    steps:
      - name: Validate the candidate and the workflow identity
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full, lowercase 40-character commit SHA"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::this workflow runs only by dispatch"
            exit 1
          fi
          if [[ "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/ci-phase2-linux-sandbox.yml@"* ]]; then
            echo "::error::unexpected workflow identity: $GITHUB_WORKFLOW_REF"
            exit 1
          fi
          # The workflow definition that runs is the candidate's own.
          if [[ "$GITHUB_SHA" != "$CANDIDATE" || "$GITHUB_WORKFLOW_SHA" != "$CANDIDATE" ]]; then
            echo "::error::dispatch this workflow on the ref whose head is $CANDIDATE (event $GITHUB_SHA, workflow $GITHUB_WORKFLOW_SHA)"
            exit 1
          fi
          echo "Candidate: \`$CANDIDATE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          clean: true

      - name: Verify the exact candidate and a clean checkout
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          tested="$(git rev-parse HEAD)"
          if [[ "$tested" != "$CANDIDATE" ]]; then
            echo "::error::checked out $tested but the candidate is $CANDIDATE"
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all --ignored)" ]]; then
            echo "::error::the checkout is not clean"
            git status --short --ignored
            exit 1
          fi
          echo "Tested commit: $tested"

      - name: Use the runner's installed Rust 1.94.0 (no rustup, nothing installed)
        shell: bash
        run: |
          set -euo pipefail
          toolchain="${RUSTUP_HOME:-$HOME/.rustup}/toolchains/1.94.0-x86_64-unknown-linux-gnu/bin"
          for tool in cargo rustc rustdoc; do
            if [[ ! -x "$toolchain/$tool" ]]; then
              echo "::error::$toolchain/$tool is missing: provision Rust 1.94.0 on this runner"
              exit 1
            fi
          done
          echo "$toolchain" >> "$GITHUB_PATH"

      - name: Use the persistent Cargo target cache (outside the checkout)
        shell: bash
        run: |
          set -euo pipefail
          cache="$(dirname "$GITHUB_WORKSPACE")/.nexus-fast-cache"
          mkdir -p "$cache/cargo-target"
          echo "CARGO_TARGET_DIR=$cache/cargo-target" >> "$GITHUB_ENV"
          if ! rustc --version | grep -q '^rustc 1\.94\.0 '; then
            echo "::error::expected rustc 1.94.0, found: $(rustc --version)"
            exit 1
          fi

      # Evidence of the host, and an early, explicit failure for a missing
      # layer. The live suite below checks every layer again itself.
      - name: Required host layers (the job fails if any is missing)
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          missing=0
          need() { echo "::error::$1"; missing=1; }
          echo "user: $(id -un) ($uid); kernel: $(uname -r); arch: $(uname -m)"
          [[ "$(uname -m)" == "x86_64" ]] || need "the verifier sandbox is x86_64 Linux only"
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo "apparmor_restrict_unprivileged_userns=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          fi
          abi="$(python3 -c 'import ctypes; libc = ctypes.CDLL(None, use_errno=True); libc.syscall.restype = ctypes.c_long; print(max(libc.syscall(444, None, ctypes.c_size_t(0), ctypes.c_uint32(1)), 0))')"
          echo "landlock ABI: $abi"
          (( abi >= 6 )) || need "Landlock ABI $abi is below the required 6"
          runtime="/run/user/$uid"
          [[ -d "$runtime" && "$(stat -f -c %T "$runtime")" == "tmpfs" && "$(stat -c %u:%a "$runtime")" == "$uid:700" ]] \
            || need "$runtime is missing or not a private tmpfs: the runner user needs a systemd user manager (lingering)"
          [[ -S "$runtime/bus" ]] || need "no systemd user manager bus at $runtime/bus for $(id -un)"
          # The unified cgroup v2 hierarchy (I4's membership model: one
          # `0::` line per process); hybrid or v1 fails closed here too.
          [[ "$(stat -f -c %T /sys/fs/cgroup)" == "cgroup2fs" ]] || need "/sys/fs/cgroup is not the unified cgroup v2 hierarchy ($(stat -f -c %T /sys/fs/cgroup))"
          echo "this job's cgroup membership: $(tr '\n' ' ' < /proc/self/cgroup)"
          # Version facts of the host (evidence only, never authority).
          echo "systemd: $(/usr/lib/systemd/systemd --version 2>/dev/null | head -1 || echo unknown)"
          echo "dbus: $(dbus-daemon --version 2>/dev/null | head -1 || echo unknown)"
          echo "os: $(. /etc/os-release && echo "$PRETTY_NAME")"
          {
            echo "Host: $(id -un) ($uid), $(uname -r) $(uname -m), $(. /etc/os-release && echo "$PRETTY_NAME")"
            echo "systemd: $(/usr/lib/systemd/systemd --version 2>/dev/null | head -1 || echo unknown)"
          } >> "$GITHUB_STEP_SUMMARY"
          delegated="/sys/fs/cgroup/user.slice/user-$uid.slice/user@$uid.service/cgroup.controllers"
          for controller in memory pids cpu; do
            grep -qw "$controller" "$delegated" 2>/dev/null || need "the $controller controller is not delegated to $(id -un)'s user manager"
          done
          if (( missing )); then
            echo "::error::this host cannot provide every Phase Two layer; verification would be unavailable here"
            exit 1
          fi

      - name: Setup Node.js 24.21.0 (verifier toolchain assembly)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Assemble the packaged verifier toolchain (pinned Rust 1.94.0 components)
        shell: bash
        run: node packaging/verifier-toolchain/scripts/assemble.mjs --out app/src-tauri/verifier-toolchain

      - name: Verifier sandbox unit tests
        run: cargo test -p nexus-verifier-sandbox --locked --lib

      # The checked cleanup observations the live suite and its step rely on,
      # the live harness's entry, and the live step's own script, against
      # fixtures only (no user manager or bus daemon is contacted, no
      # observation starts a process, nothing is created outside the tests'
      # temporary directories): a failed observation or inspection is never
      # "nothing left", and only no argument enters the suite.
      - name: Cleanup observation controls (fixtures only)
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p nexus-verifier-sandbox --locked --test phase2_cleanup_observation
          python3 scripts/ci/test_phase2_cleanup_check.py

      - name: Live Phase Two isolation, escape and cleanup suite (every layer required)
        shell: bash
        env:
          NEXUS_PHASE2_REQUIRE_LIVE_SANDBOX: "1"
          NEXUS_VERIFIER_TOOLCHAIN: packaged
        run: |
          set -o pipefail
          # The cleanup observation is the live harness's own observation-only
          # mode, built from this checkout by the suite's own cargo command:
          # exactly one argument (no path, uid, bus or target) and no
          # authority (it stops, kills, creates and removes nothing). Both of
          # its observations (the loaded verifier scopes and the verification
          # workspaces) always run; it fails if either cannot answer or finds
          # anything.
          observe_cleanup() {
            cargo test -p nexus-verifier-sandbox --locked --features development-toolchain --test phase2_live_sandbox -- --cleanup-observation
          }
          # The gate: whatever is already loaded or present, or an observation
          # that cannot answer, blocks the suite. Nothing is cleaned up and
          # nothing is cleared.
          preflight=0
          observe_cleanup || preflight=$?
          if (( preflight != 0 )); then
            echo "::error::the cleanup observation found something left, or could not answer, before the live suite (cargo exit $preflight): the live suite was not run"
            exit 1
          fi
          # Every result is kept. Each command of the suite's pipeline keeps
          # its own status, taken at once (the next command replaces
          # PIPESTATUS); the cleanup observation runs whatever the suite
          # reported (both of its observations, neither failure suppressing
          # the other); and the step fails if the suite, the capture of its
          # output, its passed-case count or an observation failed. A failed
          # suite keeps its own exit status, whatever else failed.
          if cargo test -p nexus-verifier-sandbox --locked --features development-toolchain --test phase2_live_sandbox 2>&1 | tee phase2-live.log; then
            statuses=("${PIPESTATUS[@]}")
          else
            statuses=("${PIPESTATUS[@]}")
          fi
          live=${statuses[0]:-255}
          captured=${statuses[1]:-255}
          passed=0
          grep -qx 'test result: ok. 39 live sandbox cases passed' phase2-live.log || passed=$?
          observed=0
          observe_cleanup || observed=$?
          if (( captured != 0 )); then
            echo "::error::the live suite's output was not fully captured (tee exit $captured)"
          fi
          if (( passed != 0 )); then
            echo "::error::the live suite did not report 39 passed cases"
          fi
          if (( observed != 0 )); then
            echo "::error::the cleanup observation found something left, or could not answer, after the live suite (cargo exit $observed)"
          fi
          if (( live != 0 )); then
            echo "::error::the live suite failed (cargo exit $live)"
            exit "$live"
          fi
          if (( captured != 0 || passed != 0 || observed != 0 )); then
            exit 1
          fi

      - name: Phase Two kernel and desktop controls
        shell: bash
        run: |
          set -o pipefail
          cargo test -p nexus-kernel --locked --lib -- p2b_ p2e_input p2h_ 2>&1 | tee phase2-kernel.log
          cargo test -p nexus-desktop-backend --locked --lib -- phase2_tests coding_flow::verification phase1_tests 2>&1 | tee phase2-desktop.log
