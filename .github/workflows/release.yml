name: NexusOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # P0-002C4D2: the backend build script embeds the manifest of the
      # assembled Builder toolchain (app/src-tauri/builder-toolchain).
      NEXUS_BUILDER_TOOLCHAIN: packaged
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@4be4450ce7d4f1b9d3d643f42e0fe4124db1d31d # 1.94.0

      - name: Setup Node.js 24.21.0 (Builder toolchain assembly)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Assemble Nexus Builder toolchain
        shell: bash
        run: node packaging/builder-toolchain/scripts/assemble.mjs --target x86_64-pc-windows-msvc --out app/src-tauri/builder-toolchain

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build Rust release
        run: cargo build --release

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build Tauri bundles (nsis preferred, msi fallback)
        shell: pwsh
        working-directory: app
        run: |
          npm run tauri build -- --bundles nsis --config src-tauri/tauri.builder-toolchain.conf.json
          if ($LASTEXITCODE -ne 0) {
            Write-Host "NSIS build failed, retrying MSI build..."
            npm run tauri build -- --bundles msi --config src-tauri/tauri.builder-toolchain.conf.json
            if ($LASTEXITCODE -ne 0) {
              throw "Tauri build failed for both NSIS and MSI bundle targets."
            }
          }

      - name: Verify bundled Builder toolchain bytes
        shell: bash
        run: |
          set -euo pipefail
          bundled=target/release/toolchain
          node packaging/builder-toolchain/scripts/assemble.mjs --compare app/src-tauri/builder-toolchain "$bundled"

      - name: Print bundle tree (Windows)
        shell: pwsh
        run: |
          Write-Host "=== bundle tree ==="
          Get-ChildItem -Recurse target\release\bundle -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Discover and normalize Windows artifacts
        id: collect_windows
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v([0-9]+\.[0-9]+\.[0-9]+).*$','$1'
          $bundle = "target/release/bundle"
          $outDir = "release-artifacts"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          Write-Host "Listing bundle directory:"
          Get-ChildItem -Recurse $bundle -ErrorAction SilentlyContinue | Select-Object FullName

          $exe = Get-ChildItem $bundle -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            Sort-Object FullName |
            Select-Object -First 1
          $msi = Get-ChildItem $bundle -Recurse -Filter *.msi -ErrorAction SilentlyContinue |
            Sort-Object FullName |
            Select-Object -First 1

          if (-not $exe -and -not $msi) {
            Write-Error "No Windows installers found."
            Get-ChildItem -Recurse $bundle -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }

          if ($exe) {
            Copy-Item $exe.FullName "${outDir}/NexusOS_${version}_windows.exe" -Force
          }
          if ($msi) {
            Copy-Item $msi.FullName "${outDir}/NexusOS_${version}_windows.msi" -Force
          }

          $normalized = Get-ChildItem $outDir -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in ".exe", ".msi" } |
            Sort-Object FullName |
            ForEach-Object { $_.FullName }
          if (-not $normalized -or $normalized.Count -eq 0) {
            throw "Normalization produced no Windows artifacts."
          }
          "files<<EOF" >> $env:GITHUB_OUTPUT
          $normalized | ForEach-Object { $_ >> $env:GITHUB_OUTPUT }
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NexusOS-Windows
          path: ${{ steps.collect_windows.outputs.files }}

  build-linux:
    runs-on: ubuntu-latest
    env:
      # P0-002C4D2: the backend build script embeds the manifest of the
      # assembled Builder toolchain (app/src-tauri/builder-toolchain).
      NEXUS_BUILDER_TOOLCHAIN: packaged
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            pkg-config \
            build-essential

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@4be4450ce7d4f1b9d3d643f42e0fe4124db1d31d # 1.94.0

      - name: Setup Node.js 24.21.0 (Builder toolchain assembly)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Assemble Nexus Builder toolchain
        shell: bash
        run: node packaging/builder-toolchain/scripts/assemble.mjs --target x86_64-unknown-linux-gnu --out app/src-tauri/builder-toolchain

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build Rust release
        run: cargo build --release

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build Tauri bundles (deb)
        working-directory: app
        run: npm run tauri build -- --bundles deb --config src-tauri/tauri.builder-toolchain.conf.json

      - name: Verify bundled Builder toolchain bytes
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$(find target/release/bundle/deb -mindepth 2 -maxdepth 2 -type d -name data | LC_ALL=C sort | head -n 1)"
          bundled="${data_dir}/usr/lib/NexusOS/toolchain"
          node packaging/builder-toolchain/scripts/assemble.mjs --compare app/src-tauri/builder-toolchain "$bundled"

      - name: Print bundle tree (Linux)
        run: |
          pwd
          echo "=== bundle tree ==="
          ls -R target/release/bundle || true

      - name: Discover and normalize Linux artifacts
        id: collect_linux
        shell: bash
        run: |
          set -euo pipefail
          version="$(echo "${GITHUB_REF_NAME}" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')"
          bundle_root="target/release/bundle"
          mkdir -p release-artifacts

          deb_file="$(find "${bundle_root}" -type f -name '*.deb' | LC_ALL=C sort | head -n 1)"
          if [ -z "${deb_file}" ]; then
            echo "No .deb produced. Check Tauri bundle targets." >&2
            ls -R "${bundle_root}" || true
            exit 1
          fi

          out="release-artifacts/nexus-os_${version}_amd64.deb"
          cp "${deb_file}" "${out}"

          {
            echo "files<<EOF"
            echo "${out}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NexusOS-Linux
          path: ${{ steps.collect_linux.outputs.files }}

  build-macos:
    runs-on: macos-latest
    env:
      # P0-002C4D2: the backend build script embeds the manifest of the
      # assembled Builder toolchain (app/src-tauri/builder-toolchain).
      NEXUS_BUILDER_TOOLCHAIN: packaged
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@4be4450ce7d4f1b9d3d643f42e0fe4124db1d31d # 1.94.0

      - name: Setup Node.js 24.21.0 (Builder toolchain assembly)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Assemble Nexus Builder toolchain
        shell: bash
        run: node packaging/builder-toolchain/scripts/assemble.mjs --target aarch64-apple-darwin --out app/src-tauri/builder-toolchain

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build Rust release
        run: cargo build --release

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build Tauri bundles (dmg)
        working-directory: app
        run: npm run tauri build -- --bundles dmg --config src-tauri/tauri.builder-toolchain.conf.json

      - name: Verify bundled Builder toolchain bytes
        shell: bash
        run: |
          set -euo pipefail
          bundled=target/release/bundle/macos/NexusOS.app/Contents/Resources/toolchain
          node packaging/builder-toolchain/scripts/assemble.mjs --compare app/src-tauri/builder-toolchain "$bundled"

      - name: Print bundle tree (macOS)
        run: |
          pwd
          echo "=== bundle tree ==="
          ls -R target/release/bundle || true

      - name: Discover and normalize macOS artifacts
        id: collect_macos
        shell: bash
        run: |
          set -euo pipefail
          version="$(echo "${GITHUB_REF_NAME}" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')"
          bundle_root="target/release/bundle"
          mkdir -p release-artifacts

          dmg_file="$(find "${bundle_root}" -type f -name '*.dmg' | LC_ALL=C sort | head -n 1)"
          if [ -z "${dmg_file}" ]; then
            echo "No .dmg produced. Check Tauri bundle targets." >&2
            ls -R "${bundle_root}" || true
            exit 1
          fi

          out="release-artifacts/NexusOS_${version}_universal.dmg"
          cp "${dmg_file}" "${out}"

          {
            echo "files<<EOF"
            echo "${out}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NexusOS-macOS
          path: ${{ steps.collect_macos.outputs.files }}

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0

      - name: Show downloaded artifacts
        run: |
          pwd
          ls -R

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: true
          files: |
            NexusOS-Windows/*.msi
            NexusOS-Windows/*.exe
            NexusOS-Linux/*.deb
            NexusOS-macOS/*.dmg
          body: |
            ## NexusOS ${{ github.ref_name }}

            **The AI agent OS that proves what it did.**

            ### Downloads
            - **Windows**: `NexusOS_<version>_x64-setup.exe` or `NexusOS_<version>_x64.msi`
            - **macOS**: `NexusOS_<version>_universal.dmg`
            - **Linux**: `nexus-os_<version>_amd64.deb`
