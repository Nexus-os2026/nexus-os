[workspace]
resolver = "2"
members = [
  "kernel",
  "persistence",
  "crates/nexus-crypto",
  "crates/nexus-governed-control",
  "crates/nexus-verifier-sandbox",
  "crates/nexus-typed-decision",
  "mother",
  "mother/host",
  "mother/desktop",
]

[workspace.package]
edition = "2021"
version = "10.6.0"
license = "MIT"

[workspace.dependencies]
regex = "1.10"
scraper = "0.20"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "symbols"
