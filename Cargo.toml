[workspace]
resolver = "2"
members = [
  "kernel",
  "persistence",
  "sdk",
  "connectors/llm",
  "agents/web-builder",
  "crates/nexus-crypto",
  "crates/nexus-governed-control",
  "crates/nexus-verifier-sandbox",
  "crates/nexus-memory",
  "crates/nexus-self-improve",
  "crates/nexus-outcome-eval",
]

[workspace.package]
edition = "2021"
version = "10.6.0"
license = "MIT"

[workspace.dependencies]
regex = "1.10"
scraper = "0.20"
# P2 security closure R1: pinned to Wasmtime's maintained 36.x
# security line. RUSTSEC-2026-0327 (component async-lifted
# callbacks, critical) affects 39.0.0 and later only; 36.0.20
# carries the 36.x fixes for RUSTSEC-2026-0114, -0222, -0269,
# -0316, -0363, -0379, -0380 and -0424, predates the 43.0.0 Linker
# use-after-free (RUSTSEC-2026-0090), and needs Rust 1.86 (the
# workspace pins 1.94). Nexus uses core Wasm only (no component
# model, async or WASI). Re-bump via this single workspace pin
# going forward.
# Features: Wasmtime's `default` set minus `cache` only. No Nexus
# source enables Wasmtime's on-disk compilation cache (`Config::cache`),
# and Wasmtime's cache crate, through 50.0.1, requires zstd ^0.13,
# which carries RUSTSEC-2026-0391, -0398, -0403 and -0410 with no
# 0.13.x or zstd-safe 7.x fix. When re-bumping, keep this list equal
# to the pinned release's `default` set minus `cache`.
wasmtime = { version = "36.0.20", default-features = false, features = [
    "async",
    "gc",
    "gc-drc",
    "gc-null",
    "wat",
    "profiling",
    "parallel-compilation",
    "cranelift",
    "pooling-allocator",
    "demangle",
    "addr2line",
    "coredump",
    "debug-builtins",
    "runtime",
    "component-model",
    "threads",
    "stack-switching",
    "std",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "symbols"
