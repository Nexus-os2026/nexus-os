[package]
name = "nexus-desktop-backend"
description = "Tauri backend for the Nexus OS desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["tauri-runtime"]
tauri-runtime = ["dep:tauri"]
real-claude = []
real-llama = ["nexus-flash-infer/real-llama"]
test-support = []

[dependencies]
nexus-kernel = { path = "../../kernel" }
nexus-connectors-core = { path = "../../connectors/core" }
nexus-connectors-web = { path = "../../connectors/web" }
nexus-connectors-social = { path = "../../connectors/social" }
nexus-connectors-messaging = { path = "../../connectors/messaging" }
nexus-connectors-llm = { path = "../../connectors/llm", features = ["flash-infer"] }
nexus-adaptation = { path = "../../adaptation" }
nexus-protocols = { path = "../../protocols" }
nexus-distributed = { path = "../../distributed" }
nexus-factory = { path = "../../factory" }
nexus-marketplace = { path = "../../marketplace" }
nexus-sdk = { path = "../../sdk" }
nexus-airgap = { path = "../../packaging/airgap" }
nexus-conductor = { path = "../../agents/conductor" }
web-builder-agent = { path = "../../agents/web-builder" }
nexus-enterprise = { path = "../../enterprise" }
nexus-persistence = { path = "../../persistence" }
nexus-auth = { path = "../../auth" }
nexus-tenancy = { path = "../../tenancy" }
nexus-telemetry = { path = "../../telemetry" }
nexus-integrations = { path = "../../integrations" }
nexus-metering = { path = "../../metering" }
nexus-flash-infer = { path = "../../crates/nexus-flash-infer", features = ["download"] }
nexus-capability-measurement = { path = "../../crates/nexus-capability-measurement" }
nexus-governance-oracle = { path = "../../crates/nexus-governance-oracle" }
nexus-governance-engine = { path = "../../crates/nexus-governance-engine" }
nexus-governance-evolution = { path = "../../crates/nexus-governance-evolution" }
nexus-predictive-router = { path = "../../crates/nexus-predictive-router" }
nexus-browser-agent = { path = "../../crates/nexus-browser-agent" }
nexus-token-economy = { path = "../../crates/nexus-token-economy" }
nexus-computer-control = { path = "../../crates/nexus-computer-control" }
nexus-world-simulation = { path = "../../crates/nexus-world-simulation" }
nexus-perception = { path = "../../crates/nexus-perception" }
nexus-agent-memory = { path = "../../crates/nexus-agent-memory" }
nexus-external-tools = { path = "../../crates/nexus-external-tools" }
nexus-collab-protocol = { path = "../../crates/nexus-collab-protocol" }
nexus-software-factory = { path = "../../crates/nexus-software-factory" }
nexus-mcp = { path = "../../crates/nexus-mcp" }
nexus-swarm = { path = "../../crates/nexus-swarm" }
social-poster-agent = { path = "../../agents/social-poster" }
nexus-a2a = { path = "../../crates/nexus-a2a" }
nexus-memory = { path = "../../crates/nexus-memory" }
nexus-migrate = { path = "../../crates/nexus-migrate" }
nexus-crypto = { path = "../../crates/nexus-crypto" }
nexus-self-improve = { path = "../../crates/nexus-self-improve" }
nexus-code = { path = "../../nexus-code" }
nexus-computer-use = { path = "../../crates/nexus-computer-use" }
dirs = "5"
zip = { version = "1.1", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
toml = "0.8"
uuid = { version = "1.10", features = ["v4", "serde"] }
sysinfo = "0.32"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
open = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

# P0-002C4C3 tests only: process snapshots as liveness and orphan evidence for
# the real governed launch (same locked windows-sys; no new package).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri = { version = "2.5.5", optional = true, default-features = false, features = ["tray-icon", "wry"] }
tauri-plugin-global-shortcut = "2.3.1"

[target.'cfg(target_os = "linux")'.dependencies]
tauri = { version = "2.5.5", optional = true, default-features = false, features = ["tray-icon", "wry"] }
tauri-plugin-global-shortcut = "2.3.1"

# P0 item D native boundary harness (tests/webview_boundary_live.rs): it drives
# the real Wry runtime with the production context and build_main_window, so it
# needs tauri as a (non-optional) dev-dependency. Same version and features as
# the app dependency above: no new package and no Cargo.lock change.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dev-dependencies]
tauri = { version = "2.5.5", default-features = false, features = ["tray-icon", "wry"] }

# The harness enables WebKitGTK's `javascript-can-open-windows-automatically` on
# the test webview, so a script-initiated window.open reaches the engine's
# `create` signal (wry's new-window handler, i.e. the production on_new_window)
# instead of being stopped earlier by the default popup policy, and it observes
# that signal. Same pinned version/feature wry already uses: no new package or
# version. Cargo.lock gains one line, this crate's dependency edge on the
# already-locked webkit2gtk.
[target.'cfg(target_os = "linux")'.dev-dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[build-dependencies]
tauri-build = { version = "2.5.5" }
# P0-002C4D2: the build script hashes the packaged Builder toolchain.
sha2 = "0.10"

# P0 item D: the live native boundary harness runs the real Wry event loop on
# the process main thread, so it uses its own `fn main` (harness = false) rather
# than libtest worker threads (required for the macOS UI event loop). It is
# gated behind `--ignored`: a bare `cargo test` run prints an ignored line and
# exits; it runs with `cargo test --test webview_boundary_live -- --ignored`
# (under `xvfb-run -a` on Linux).
[[test]]
name = "webview_boundary_live"
harness = false
