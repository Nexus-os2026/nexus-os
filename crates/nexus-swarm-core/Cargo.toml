[package]
name = "nexus-swarm-core"
description = "Shared types for swarm execution: Provider trait, AgentExecutionContext, EventEmitter, NodeBudget, SwarmAgentEntry. Extracted from nexus-swarm so agent crates can depend on the contract without a cycle."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

[lints]
workspace = true
