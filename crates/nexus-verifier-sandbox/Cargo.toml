[package]
name = "nexus-verifier-sandbox"
version = "0.1.0"
license = "MIT"
edition = "2021"
publish = false
description = "Phase Two governed verification: verifier profiles, sandbox and resource policy identities, and the Linux verifier sandbox helper"

[dependencies]
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
landlock = "=0.4.4"
seccompiler = "=0.5.0"

[[test]]
name = "p2c_live_sandbox"
path = "tests/p2c_live_sandbox.rs"
harness = false
