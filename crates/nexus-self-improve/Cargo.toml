[package]
name = "nexus-self-improve"
version = "10.6.0"
edition = "2021"
license = "MIT"
description = "Retained improvement-proposal primitives; no automatic Mother Nexus promotion or security-core changes"

[dependencies]
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
proptest = "1.4"
