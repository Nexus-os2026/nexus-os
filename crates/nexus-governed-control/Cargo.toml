[package]
name = "nexus-governed-control"
version = "0.1.0"
license = "MIT"
edition = "2021"
publish = false
description = "Mother Nexus capability broker: bound grants, commitments, approvals, evidence, cancellation and governed effects"

[dependencies]
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
zeroize = "1"
base64 = "0.22"
nexus-kernel = { path = "../../kernel" }
png = "0.18"
unicode-segmentation = "1.12"
rusqlite = { version = "0.41", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11rb = { version = "0.13", features = ["xtest"] }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mother_route_seams)'] }
